name: Build Stream Dashboard

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:

  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Show Python and PyInstaller versions
        run: |
          python --version
          pyinstaller --version

      - name: Build Linux executable
        run: |
          pyinstaller \
            --clean \
            --onefile \
            --name stream-dashboard \
            main.py

      - name: Show build output
        run: ls -lh dist/

      - name: Upload Linux executable
        uses: actions/upload-artifact@v4
        with:
          name: stream-dashboard-linux
          path: dist/stream-dashboard
          
  build-windows:
    name: Build Windows
    runs-on: windows-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Show Python and PyInstaller versions
        run: |
          python --version
          pyinstaller --version

      - name: Build Windows executable
        run: |
          pyinstaller --clean --onefile --name stream-dashboard main.py

      - name: Show build output
        run: dir dist

      - name: Upload Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: stream-dashboard-windows
          path: dist/stream-dashboard.exe
